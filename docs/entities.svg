<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <style>
    .bg{fill:#f5f6f8}.card{fill:#ffffff;stroke:#e3e6ea}.hdr{fill:#03a9f4}
    .t{fill:#2b3038}.m{fill:#8a929c}.row{fill:#fafbfc;stroke:#eef1f4}
    .on{fill:#0a8f3c}.val{fill:#111}.chip{fill:#eef7ff;stroke:#cfe8fb}.chipt{fill:#0277bd}
    @media (prefers-color-scheme:dark){
      .bg{fill:#14171c}.card{fill:#1d2127;stroke:#2b313a}.t{fill:#e7ebf0}.m{fill:#9aa3ad}
      .row{fill:#232830;stroke:#2b313a}.val{fill:#f0f3f7}.chip{fill:#12303f;stroke:#1c4a63}.chipt{fill:#7fd3ff}
    }
  </style>
  <rect class="bg" width="860" height="560"/>
  <!-- device card -->
  <rect class="card" x="24" y="24" width="812" height="512" rx="14" stroke-width="1.5"/>
  <rect class="hdr" x="24" y="24" width="812" height="60" rx="14"/>
  <rect class="hdr" x="24" y="54" width="812" height="30"/>
  <circle cx="58" cy="54" r="16" fill="#ffffff" opacity=".25"/>
  <path d="M50 54h16M58 46v16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="88" y="49" fill="#fff" font-size="19" font-weight="700">Газовый котёл Rinnai</text>
  <text x="88" y="70" fill="#fff" font-size="12.5" opacity=".9">RBK-197 RTU · WF-100W · Home Assistant</text>
  <rect x="690" y="40" width="126" height="28" rx="14" fill="#ffffff" opacity=".18"/>
  <text x="753" y="59" fill="#fff" font-size="13" font-weight="600" text-anchor="middle">Источник: Локально</text>

  <!-- primary controls -->
  <text class="m" x="44" y="112" font-size="12" font-weight="600" letter-spacing=".5">УПРАВЛЕНИЕ</text>
  <g>
    <rect class="row" x="44" y="122" width="386" height="56" rx="10" stroke-width="1"/>
    <text x="62" y="147" class="t" font-size="15" font-weight="600">🌡  Отопление</text>
    <text x="62" y="167" class="m" font-size="12">climate · термостат, 10–40 °C</text>
    <text x="412" y="156" class="val" font-size="15" font-weight="700" text-anchor="end">28 → 22 °C</text>
  </g>
  <g>
    <rect class="row" x="450" y="122" width="386" height="56" rx="10" stroke-width="1"/>
    <text x="468" y="147" class="t" font-size="15" font-weight="600">🚿  Горячая вода</text>
    <text x="468" y="167" class="m" font-size="12">water_heater · 35–60 °C</text>
    <text x="818" y="156" class="val" font-size="15" font-weight="700" text-anchor="end">41.5 → 45 °C</text>
  </g>

  <!-- sensors grid -->
  <text class="m" x="44" y="208" font-size="12" font-weight="600" letter-spacing=".5">ДАТЧИКИ</text>
  <g font-size="13">
    <rect class="row" x="44" y="218" width="253" height="48" rx="9" stroke-width="1"/>
    <text x="60" y="240" class="m" font-size="11.5">Температура в доме</text><text x="281" y="248" class="val" font-weight="700" text-anchor="end">28 °C</text>
    <rect class="row" x="303" y="218" width="253" height="48" rx="9" stroke-width="1"/>
    <text x="319" y="240" class="m" font-size="11.5">Горячая вода</text><text x="540" y="248" class="val" font-weight="700" text-anchor="end">41.5 °C</text>
    <rect class="row" x="562" y="218" width="274" height="48" rx="9" stroke-width="1"/>
    <text x="578" y="240" class="m" font-size="11.5">Теплоноситель (уставка)</text><text x="820" y="248" class="val" font-weight="700" text-anchor="end">46 °C</text>

    <rect class="row" x="44" y="272" width="253" height="48" rx="9" stroke-width="1"/>
    <text x="60" y="294" class="m" font-size="11.5">Режим</text><text x="281" y="302" class="val" font-weight="700" text-anchor="end">Горячая вода</text>
    <rect class="row" x="303" y="272" width="253" height="48" rx="9" stroke-width="1"/>
    <text x="319" y="294" class="m" font-size="11.5">Ошибка котла</text><text x="540" y="302" class="on" font-weight="700" text-anchor="end">Нет</text>
    <rect class="row" x="562" y="272" width="274" height="48" rx="9" stroke-width="1"/>
    <text x="578" y="294" class="m" font-size="11.5">Горелка · водоразбор</text><text x="820" y="302" class="val" font-weight="700" text-anchor="end">1 · нет</text>
  </g>

  <!-- switches -->
  <text class="m" x="44" y="352" font-size="12" font-weight="600" letter-spacing=".5">ПЕРЕКЛЮЧАТЕЛИ И РЕЖИМЫ</text>
  <g font-size="12.5" font-weight="600">
    <rect class="chip" x="44" y="362" width="132" height="34" rx="17" stroke-width="1"/><text class="chipt" x="110" y="384" text-anchor="middle">Питание ●</text>
    <rect class="chip" x="184" y="362" width="132" height="34" rx="17" stroke-width="1"/><text class="chipt" x="250" y="384" text-anchor="middle">ГВС ●</text>
    <rect class="chip" x="324" y="362" width="150" height="34" rx="17" stroke-width="1"/><text class="chipt" x="399" y="384" text-anchor="middle">Отопление ○</text>
    <rect class="chip" x="482" y="362" width="120" height="34" rx="17" stroke-width="1"/><text class="chipt" x="542" y="384" text-anchor="middle">Отъезд ○</text>
    <rect class="chip" x="610" y="362" width="112" height="34" rx="17" stroke-width="1"/><text class="chipt" x="666" y="384" text-anchor="middle">Эконом ○</text>
    <rect class="chip" x="730" y="362" width="106" height="34" rx="17" stroke-width="1"/><text class="chipt" x="783" y="384" text-anchor="middle">Ночной ○</text>
  </g>

  <!-- diagnostics -->
  <text class="m" x="44" y="430" font-size="12" font-weight="600" letter-spacing=".5">ДИАГНОСТИКА</text>
  <g font-size="12.5" font-weight="600">
    <rect class="chip" x="44" y="440" width="150" height="34" rx="17" stroke-width="1"/><text class="chipt" x="119" y="462" text-anchor="middle">Авария ○</text>
    <rect class="chip" x="202" y="440" width="168" height="34" rx="17" stroke-width="1"/><text class="chipt" x="286" y="462" text-anchor="middle">Нет связи ○</text>
    <rect class="chip" x="378" y="440" width="150" height="34" rx="17" stroke-width="1"/><text class="chipt" x="453" y="462" text-anchor="middle">Расписание</text>
    <rect class="chip" x="536" y="440" width="150" height="34" rx="17" stroke-width="1"/><text class="chipt" x="611" y="462" text-anchor="middle">Источник</text>
  </g>

  <text class="m" x="44" y="512" font-size="11.5">● вкл · ○ выкл — иллюстрация набора сущностей интеграции (не скриншот). 21 сущность · Apple Home через мост HomeKit.</text>
</svg>
